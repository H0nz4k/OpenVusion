# OpenVusion RF Probe v0.7.0
# Target: nrf52840dongle/nrf52840
# nRF Connect SDK 3.4.0 / Zephyr 4.4.x
#
# IMPORTANT:
# nrf52840dongle/nrf52840 ALREADY contains exactly one CDC ACM UART via
# boards/common/usb/cdc_acm_serial.dtsi as board_cdc_acm_uart.
# Therefore this project MUST NOT add another zephyr,cdc-acm-uart node.

CONFIG_GPIO=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y
CONFIG_RING_BUFFER=y
CONFIG_HWINFO=y

CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n

# CDC belongs only to OpenVusion application.
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_STDOUT_CONSOLE=n
CONFIG_LOG=n

CONFIG_MAIN_STACK_SIZE=4096
