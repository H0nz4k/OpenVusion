[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hwsniff"
version = "2.1.0"
description = "OpenVusion HWSniff v2 — Pi Zero 2 W headless GPIO NFC field appliance"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyserial>=3.5",
]

[project.optional-dependencies]
legacy-ui = ["pygame-ce>=2.4.0"]
dev = ["pytest>=7.0"]

[project.scripts]
hwsniff = "hwsniff.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
